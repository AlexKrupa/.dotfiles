# -Xmx10g: max heap. Default: 512m.
# -Xms1g: initial heap. Default: 1/64 of the physical memory.
# -XX:MaxMetaspaceSize=1g: max memory for class metadata. Default: 384m.
# -XX:+UseG1GC: garbage collector. Default: same on JDK 21+.
# -XX:G1PeriodicGCInterval=60000: GC after 60 seconds of no activity.
#   Then it returns the unused heap to the OS. Default: 0 (off).
# -XX:+HeapDumpOnOutOfMemoryError: Default: off.
# -XX:HeapDumpPath=/tmp: Default: working directory.
org.gradle.jvmargs=\
  -Xmx10g \
  -Xms1g \
  -XX:MaxMetaspaceSize=1g \
  -XX:+UseG1GC \
  -XX:G1PeriodicGCInterval=60000 \
  -XX:+HeapDumpOnOutOfMemoryError \
  -XX:HeapDumpPath=/tmp

org.gradle.caching=true
org.gradle.daemon.idletimeout=3600000
org.gradle.parallel=true
org.gradle.workers.max=8
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn
# Parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
org.gradle.warning.mode=summary

kotlin.code.style=official

# -Xmx6g: max heap. Default: from org.gradle.jvmargs.
# -XX:MaxMetaspaceSize=768m: max memory for class metadata. Default: from org.gradle.jvmargs.
# -XX:ReservedCodeCacheSize=512m: buffer for JIT-compiled code. Default: 320m.
# -XX:+UseG1GC: garbage collector. Default: ParallelGC.
#   ParallelGC does not return the unused heap to the OS.
# -XX:G1PeriodicGCInterval=60000: GC after 60 seconds of no activity.
#   Then it returns the unused heap to the OS. Default: 0 (off).
kotlin.daemon.jvmargs=\
  -Xmx6g \
  -XX:MaxMetaspaceSize=768m \
  -XX:ReservedCodeCacheSize=512m \
  -XX:+UseG1GC \
  -XX:G1PeriodicGCInterval=60000
