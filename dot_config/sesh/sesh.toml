# Cache slows down list update when a session is killed
cache = false

[default_session]
preview_command = "ls {}"

[[session]]
preview_command = "ls {}"

[[session]]
name = "home (~)"
path = "~"
disable_startup_command = true

[[session]]
name = "src"
path = "~/src"
startup_command = "yazi"

[[session]]
name = "Downloads"
path = "~/Downloads"
startup_command = "yazi"

[[session]]
name = "qmk-keymap"
path = "~/src/me/qmk-keymap"
startup_command = "yazi"

[[session]]
name = "config"
path = "~/.config"
startup_command = "yazi"

[[session]]
name = "aerospace"
path = "~/.config/aerospace"
startup_command = "nvim aerospace.toml"

[[session]]
name = "agents"
path = "~/.config/agents"
startup_command = "yazi"

[[session]]
name = "claude"
path = "~/.claude"
startup_command = "nvim settings.json"

[[session]]
name = "espanso"
path = "~/.config/espanso"
startup_command = "yazi"

[[session]]
name = "fish"
path = "~/.config/fish"
startup_command = "nvim config.fish"

[[session]]
name = "ghostty"
path = "~/.config/ghostty"
startup_command = "nvim config"

[[session]]
name = "herdr"
path = "~/.config/herdr"
startup_command = "nvim config.toml"

[[session]]
name = "kanata"
path = "~/.config/kanata"
startup_command = "nvim kanata.kbd"

[[session]]
name = "lazygit"
path = "~/.config/lazygit"
startup_command = "nvim config.yml"

[[session]]
name = "nvim"
path = "~/.config/nvim"
startup_command = "nvim init.lua"

[[session]]
name = "sesh"
path = "~/.config/sesh"
startup_command = "nvim sesh.toml"

[[session]]
name = "tmux"
path = "~/.config/tmux"
startup_command = "nvim tmux.conf"

[[session]]
name = "yazi"
path = "~/.config/yazi"
startup_command = "nvim yazi.toml"
