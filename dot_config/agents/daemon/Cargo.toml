[package]
name = "watchd"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[features]
# The fake engine of the tests. The dev-dependency on this package turns it on for `cargo test`
# only: the release build has no fake.
test-support = []

[dev-dependencies]
watchd = { path = ".", features = ["test-support"] }
