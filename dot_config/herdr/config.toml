onboarding = false

[terminal]
default_shell = "/opt/homebrew/bin/fish"
shell_mode = "login"
new_cwd = "follow"

[theme]
name = "dracula"

[update]
manifest_check = true
version_check = true

[ui]
agent_panel_sort = "spaces"
copy_on_select = true
hide_tab_bar_when_single_tab = false
mouse_capture = true
mouse_scroll_lines = 1             # default 3
pane_borders = true
pane_gaps = true
pane_scrollbars = true
prompt_new_tab_name = false        # default true
show_agent_labels_on_pane_borders = false
sidebar_max_width = 48             # default 36
sidebar_min_width = 18
tab_bar_position = "top"

# Tokens: {hostname}, {workspace}, {tab}, {pane}, {terminal_title}. Rendered on the
# server, so {hostname} names the host the panes run on.
window_title = "{workspace} • {tab}"   # default

# Line 1 - workspace
# Line 2 - session title reported by Claude Code via statusline script
[ui.sidebar.agents]
rows = [["state_icon", "workspace"], ["$session"]]

[ui.sound]
enabled = true

[ui.toast]
delivery = "herdr"                 # options: off herdr terminal system
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[experimental]
kitty_graphics = true
pane_history = false

[session]
resume_agents_on_restore = true    # default, resumes Claude Code conversations after a restart

[keys]
prefix = "ctrl+space"

# Help and settings
help                     = "prefix+?"
settings                 = "prefix+s"

# Workspaces
goto                     = "prefix+g"
workspace_picker         = "prefix+w"
new_workspace            = "prefix+shift+n"
rename_workspace         = "prefix+shift+w"
close_workspace          = "prefix+shift+d"
previous_workspace       = "alt+e"                       # default: unset
next_workspace           = "alt+r"                       # default: unset
switch_workspace         = "alt+1..9"                    # default: unset

# Worktrees
new_worktree             = ["prefix+shift+g", "alt+G"]   # default + added
# open_worktree                                          # default: unset
# remove_worktree                                        # default: unset

# Agents
previous_agent           = "ctrl+alt+e"                  # default: unset
next_agent               = "ctrl+alt+r"                  # default: unset
focus_agent              = "ctrl+alt+1..9"               # default: unset

# Tabs
new_tab                  = ["prefix+c", "alt+t"]         # default + added
rename_tab               = ["prefix+shift+t", "alt+n"]   # default + added
previous_tab             = ["prefix+p", "alt+E"]         # default + added
next_tab                 = ["prefix+n", "alt+R"]         # default + added
switch_tab               = ["prefix+1..9", "alt+shift+1..9"]   # default + added
close_tab                = ["prefix+shift+x", "alt+W"]   # default + added

# Panes
focus_pane_left          = ["prefix+h", "alt+h"]         # default + added
focus_pane_down          = ["prefix+j", "alt+j"]         # default + added
focus_pane_up            = ["prefix+k", "alt+k"]         # default + added
focus_pane_right         = ["prefix+l", "alt+l"]         # default + added
swap_pane_left           = ["prefix+shift+h", "alt+H"]   # default + added
swap_pane_down           = ["prefix+shift+j", "alt+J"]   # default + added
swap_pane_up             = ["prefix+shift+k", "alt+K"]   # default + added
swap_pane_right          = ["prefix+shift+l", "alt+L"]   # default + added
split_vertical           = ""                            # unset, see the pane commands below
split_horizontal         = ""                            # unset, see the pane commands below
close_pane               = ""                            # unset, see the pane commands below
zoom                     = ["prefix+z", "alt+z"]         # default + added
copy_mode                = ["prefix+[", "alt+v"]         # default + added
rename_pane              = "prefix+shift+p"
edit_scrollback          = "prefix+e"
resize_mode              = "prefix+r"
resize_pane_left         = "ctrl+alt+h"                  # default: unset
resize_pane_down         = "ctrl+alt+j"                  # default: unset
resize_pane_up           = "ctrl+alt+k"                  # default: unset
resize_pane_right        = "ctrl+alt+l"                  # default: unset
cycle_pane_next          = "prefix+tab"
cycle_pane_previous      = "prefix+shift+tab"
# last_pane                                              # default: unset

# Session and UI
detach                   = "prefix+q"
reload_config            = "prefix+shift+r"
toggle_sidebar           = "prefix+b"
open_notification_target = "prefix+o"
remote_image_paste       = "ctrl+v"

# Navigate mode: unmodified keys, active only inside navigate mode
navigate_workspace_up    = "up"
navigate_workspace_down  = "down"
navigate_pane_left       = "h"
navigate_pane_down       = "j"
navigate_pane_up         = "k"
navigate_pane_right      = "l"

# --- Custom commands ---

# A tab, not a popup: lazygit stays out of the way of tab and pane keys. The tab
# holds one pane, so quitting lazygit ends its shell and herdr closes the tab.
# HERDR_PANE_CMD is the fast-pane path from conf.d/00-herdr-fast-pane.fish, which
# skips conf.d and needs PATH from here.
[[keys.command]]
key = "alt+g"
type = "shell"
command = 'herdr tab create --focus --cwd "$HERDR_ACTIVE_PANE_CWD" --env "PATH=$PATH" --env "HERDR_PANE_CMD=exec lazygit"'
description = "lazygit in a new tab"

# --- Custom commands: panes ---

[[keys.command]]
key = "alt+T"
type = "shell"
command = "~/.config/herdr/bin/balance-panes.sh break"
description = "pane to new tab"

[[keys.command]]
key = "alt+="
type = "shell"
command = "~/.config/herdr/bin/balance-panes.sh equalize"
description = "even out splits"

# --- Custom commands: splits and closes ---
# These replace the built-in actions unset above. Every other split in the tab is
# left alone.

[[keys.command]]
key = ["prefix+v", "alt+slash"]
type = "shell"
command = "~/.config/herdr/bin/balance-panes.sh split right"
description = "split side by side, even that column group"

[[keys.command]]
key = ["prefix+minus", "alt+minus"]
type = "shell"
command = "~/.config/herdr/bin/balance-panes.sh split down"
description = "split stacked, even that row group"

[[keys.command]]
key = ["prefix+x", "alt+w"]
type = "shell"
command = "~/.config/herdr/bin/balance-panes.sh close"
description = "close pane, even what is left"

# One absolute path per line in ~/.config/herdr/projects.local: line 1 is alt+y,
# line 2 alt+u, through line 5 for alt+p. A missing file, blank line or comment
# makes the key do nothing. That file is machine-local, never committed.

[[keys.command]]
key = "alt+y"
type = "shell"
command = "~/.config/herdr/bin/project 1"
description = "project 1"

[[keys.command]]
key = "alt+u"
type = "shell"
command = "~/.config/herdr/bin/project 2"
description = "project 2"

[[keys.command]]
key = "alt+i"
type = "shell"
command = "~/.config/herdr/bin/project 3"
description = "project 3"

[[keys.command]]
key = "alt+o"
type = "shell"
command = "~/.config/herdr/bin/project 4"
description = "project 4"

[[keys.command]]
key = "alt+p"
type = "shell"
command = "~/.config/herdr/bin/project 5"
description = "project 5"

# --- Custom commands: plugin actions ---

[[keys.command]]
key = "alt+x"
type = "plugin_action"
command = "termscope.open"
description = "open a visible file"

[[keys.command]]
key = "alt+X"
type = "plugin_action"
command = "termscope.open-links"
description = "open a visible link"

[[keys.command]]
key = "alt+s"
type = "plugin_action"
command = "fullerzz.sesh.open-picker"
description = "session picker"

[[keys.command]]
key = "alt+a"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "alt+d"
type = "plugin_action"
command = "fullerzz.sesh.last"
description = "previous workspace"

[[keys.command]]
key = "alt+c"
type = "plugin_action"
command = "rmarganti.herdr-pluck.pluck"
description = "copy with hints"

[[keys.command]]
key = "alt+D"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle review pane"
