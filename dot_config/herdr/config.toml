onboarding = false

[terminal]
default_shell = "/opt/homebrew/bin/fish"
shell_mode = "login"
new_cwd = "follow"

[theme]
name = "dracula"

[update]
manifest_check = true
version_check = true

[ui]
agent_panel_sort = "spaces"
copy_on_select = true
hide_tab_bar_when_single_tab = false
mouse_capture = true
mouse_scroll_lines = 1             # default 3
pane_borders = true
pane_gaps = true
pane_scrollbars = true
prompt_new_tab_name = false        # default true
show_agent_labels_on_pane_borders = false
sidebar_max_width = 48             # default 36
sidebar_min_width = 18
tab_bar_position = "top"

[ui.sound]
enabled = true

[ui.toast]
delivery = "herdr"                 # options: off herdr terminal system
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[experimental]
kitty_graphics = true
pane_history = false

[session]
resume_agents_on_restore = true    # default, resumes Claude Code conversations after a restart

# [advanced] scrollback_limit_bytes defaults to 10 MB per pane, the rough
# equivalent of `history-limit 50000`. Left at the default.

[keys]
prefix = "ctrl+space"

# Help and settings
help                     = "prefix+?"
settings                 = "prefix+s"

# Workspaces
goto                     = "prefix+g"
workspace_picker         = "prefix+w"
new_workspace            = "prefix+shift+n"
rename_workspace         = "prefix+shift+w"
close_workspace          = "prefix+shift+d"
previous_workspace       = "alt+e"                       # default: unset
next_workspace           = "alt+r"                       # default: unset
switch_workspace         = "alt+1..9"                    # default: unset

# Worktrees
new_worktree             = ["prefix+shift+g", "alt+G"]   # default + added
# open_worktree                                          # default: unset
# remove_worktree                                        # default: unset

# Agents
previous_agent           = "ctrl+alt+e"                  # default: unset
next_agent               = "ctrl+alt+r"                  # default: unset
focus_agent              = "ctrl+alt+1..9"               # default: unset

# Tabs
new_tab                  = ["prefix+c", "alt+t"]         # default + added
rename_tab               = ["prefix+shift+t", "alt+n"]   # default + added
previous_tab             = ["prefix+p", "alt+E"]         # default + added
next_tab                 = ["prefix+n", "alt+R"]         # default + added
switch_tab               = ["prefix+1..9", "alt+shift+1..9"]   # default + added
close_tab                = ["prefix+shift+x", "alt+W"]   # default + added

# Panes
focus_pane_left          = ["prefix+h", "alt+h"]         # default + added
focus_pane_down          = ["prefix+j", "alt+j"]         # default + added
focus_pane_up            = ["prefix+k", "alt+k"]         # default + added
focus_pane_right         = ["prefix+l", "alt+l"]         # default + added
swap_pane_left           = ["prefix+shift+h", "alt+H"]   # default + added
swap_pane_down           = ["prefix+shift+j", "alt+J"]   # default + added
swap_pane_up             = ["prefix+shift+k", "alt+K"]   # default + added
swap_pane_right          = ["prefix+shift+l", "alt+L"]   # default + added
split_vertical           = ""                            # unset, see the pane commands below
split_horizontal         = ""                            # unset, see the pane commands below
close_pane               = ""                            # unset, see the pane commands below
zoom                     = ["prefix+z", "alt+z"]         # default + added
copy_mode                = ["prefix+[", "alt+v"]         # default + added
rename_pane              = "prefix+shift+p"
edit_scrollback          = "prefix+e"
resize_mode              = "prefix+r"
cycle_pane_next          = "prefix+tab"
cycle_pane_previous      = "prefix+shift+tab"
# last_pane                                              # default: unset

# Session and UI
detach                   = "prefix+q"
reload_config            = "prefix+shift+r"
toggle_sidebar           = "prefix+b"
open_notification_target = "prefix+o"
remote_image_paste       = "ctrl+v"

# Navigate mode: unmodified keys, active only inside navigate mode
navigate_workspace_up    = "up"
navigate_workspace_down  = "down"
navigate_pane_left       = "h"
navigate_pane_down       = "j"
navigate_pane_up         = "k"
navigate_pane_right      = "l"

# --- Custom commands ---

[[keys.command]]
key = "alt+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "90%"
height = "90%"

# --- Custom commands: plugin actions ---

[[keys.command]]
key = "alt+T"
type = "shell"
command = "~/.config/herdr/bin/break-pane"
description = "pane to new tab"

[[keys.command]]
key = "alt+="
type = "shell"
command = "~/.config/herdr/bin/equalize-panes"
description = "even out splits"

# --- Custom commands: splits and closes ---
# The built-in split and close actions are unset above. bin/split-pane and
# bin/close-pane do the same over the CLI and then even out the row or column
# group the pane joined or left, leaving every other split in the tab alone.

[[keys.command]]
key = ["prefix+v", "alt+slash"]
type = "shell"
command = "~/.config/herdr/bin/split-pane right"
description = "split side by side, even that column group"

[[keys.command]]
key = ["prefix+minus", "alt+minus"]
type = "shell"
command = "~/.config/herdr/bin/split-pane down"
description = "split stacked, even that row group"

[[keys.command]]
key = ["prefix+x", "alt+w"]
type = "shell"
command = "~/.config/herdr/bin/close-pane"
description = "close pane, even what is left"

# --- Custom commands: pane resize ---
# Herdr has no direct resize actions, only resize_mode (prefix+r). These call the
# CLI instead. HERDR_ACTIVE_PANE_ID, not --current: --current falls back to the
# UI-focused pane, which is the wrong tab once a second client is attached.

[[keys.command]]
key = "ctrl+alt+h"
type = "shell"
command = 'herdr pane resize --pane "$HERDR_ACTIVE_PANE_ID" --direction left --amount 0.05'
description = "resize pane left"

[[keys.command]]
key = "ctrl+alt+j"
type = "shell"
command = 'herdr pane resize --pane "$HERDR_ACTIVE_PANE_ID" --direction down --amount 0.05'
description = "resize pane down"

[[keys.command]]
key = "ctrl+alt+k"
type = "shell"
command = 'herdr pane resize --pane "$HERDR_ACTIVE_PANE_ID" --direction up --amount 0.05'
description = "resize pane up"

[[keys.command]]
key = "ctrl+alt+l"
type = "shell"
command = 'herdr pane resize --pane "$HERDR_ACTIVE_PANE_ID" --direction right --amount 0.05'
description = "resize pane right"

# alt+y/u/i/o/p read one absolute path per line from ~/.config/herdr/projects.local:
# line 1 is alt+y, line 2 alt+u, and so on through line 5 for alt+p. A missing file,
# blank line or comment makes the key do nothing. That file is machine-local, never
# committed.

[[keys.command]]
key = "alt+y"
type = "shell"
command = "~/.config/herdr/bin/project 1"
description = "project 1"

[[keys.command]]
key = "alt+u"
type = "shell"
command = "~/.config/herdr/bin/project 2"
description = "project 2"

[[keys.command]]
key = "alt+i"
type = "shell"
command = "~/.config/herdr/bin/project 3"
description = "project 3"

[[keys.command]]
key = "alt+o"
type = "shell"
command = "~/.config/herdr/bin/project 4"
description = "project 4"

[[keys.command]]
key = "alt+p"
type = "shell"
command = "~/.config/herdr/bin/project 5"
description = "project 5"

# --- Custom commands: plugin actions ---

[[keys.command]]
key = "alt+x"
type = "plugin_action"
command = "termscope.open"
description = "open a visible file"

[[keys.command]]
key = "alt+X"
type = "plugin_action"
command = "termscope.open-links"
description = "open a visible link"

[[keys.command]]
key = "alt+s"
type = "plugin_action"
command = "fullerzz.sesh.open-picker"
description = "session picker"

[[keys.command]]
key = "alt+a"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "alt+d"
type = "plugin_action"
command = "fullerzz.sesh.last"
description = "previous workspace"

[[keys.command]]
key = "alt+c"
type = "plugin_action"
command = "rmarganti.herdr-pluck.pluck"
description = "copy with hints"
