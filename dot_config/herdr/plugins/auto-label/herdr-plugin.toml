id = "local.auto-label"
name = "Auto label"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "Name each tab after its focused pane, and number every tab, workspace and agent"
platforms = ["macos"]

# herdr's docs call startup entries one-shot initialization, not supervised daemons, so
# this spawns the watcher and exits. The events below re-check the pid file, which brings
# the watcher back if it dies.
[[startup]]
command = ["./watch.sh", "ensure"]

[[events]]
on = "tab.created"
command = ["./watch.sh", "ensure"]

[[events]]
on = "workspace.created"
command = ["./watch.sh", "ensure"]
