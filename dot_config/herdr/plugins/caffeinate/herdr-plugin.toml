id = "local.caffeinate"
name = "Caffeinate while agents work"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Hold a macOS idle-sleep assertion while any agent is working"
platforms = ["macos"]

# The watcher owns the assertion. It must live longer than a single event. startup spawns
# the watcher. pane.agent_detected tries the watcher lock, which revives a dead watcher.
[[startup]]
command = ["./watch.sh", "ensure"]

[[events]]
on = "pane.agent_detected"
command = ["./watch.sh", "ensure"]
