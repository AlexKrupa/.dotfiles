id = "local.watch"
name = "Watch"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Send the notifications of the watch daemon and write its sidebar values"
platforms = ["macos"]

# herdr's docs call startup entries one-shot initialization, not supervised daemons, so
# this spawns the watcher and exits. The events below try the watcher lock, which brings
# the watcher back if it dies.
[[startup]]
command = ["./watch.sh", "startup"]

[[events]]
on = "tab.created"
command = ["./watch.sh", "ensure"]

[[events]]
on = "workspace.created"
command = ["./watch.sh", "ensure"]
