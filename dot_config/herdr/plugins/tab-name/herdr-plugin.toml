id = "local.tab-name"
name = "Tab names"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Name each tab after its focused pane, keeping a position number on the label"
platforms = ["macos"]

# herdr's docs call startup entries one-shot initialization, not supervised daemons, so
# this spawns the watcher and exits. tab.created re-checks the pid file, which is what
# brings the watcher back if it ever dies.
[[startup]]
command = ["./watch.sh", "ensure"]

[[events]]
on = "tab.created"
command = ["./watch.sh", "ensure"]
