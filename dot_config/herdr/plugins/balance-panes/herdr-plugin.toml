id = "local.balance-panes"
name = "Balance panes on exit"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Even out a tab when a pane's process ends on its own"
platforms = ["macos"]

# The split and close keys cover panes the user acts on. A pane whose process
# ended by itself fires no key. pane.closed is not hooked: the close key already
# handles it, and that event has no tab id.
[[events]]
on = "pane.exited"
command = ["../../bin/balance-panes.sh", "on-exit"]
